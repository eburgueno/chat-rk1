apiVersion: v1
kind: Namespace
metadata:
  name: chat-rk1
  labels:
    app.kubernetes.io/part-of: chat-rk1
    # llama-server needs a privileged pod + hostPath /dev/accel to reach the
    # NPU. The usual cluster default PodSecurity level is "baseline", which
    # forbids both, so this namespace opts into "privileged". (With a DRM-accel
    # device plugin instead of hostPath you could drop back to baseline — see
    # k8s/README.md.)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
