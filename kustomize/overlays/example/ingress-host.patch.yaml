# Your chat hostname. If your ingress controller has a default (wildcard)
# certificate, the tls block needs no secretName; with cert-manager, add the
# cluster-issuer annotation and a secretName (see k8s/50-ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: chat-rk1
spec:
  rules:
    - host: chat.my.domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  name: http
  tls:
    - hosts:
        - chat.my.domain
