name: rocket-patched
variant: scratch
shell: /bin/bash
# {{ if eq .ARCH "aarch64" }} YAML comment; bldr evaluates the Go template.
dependencies:
  - stage: base
  # rocket-patched-pkg is built in the siderolabs/pkgs fork and contains the
  # PATCHED rocket.ko (081 clock lever + 083 IOMMU keep-attached), compiled
  # against the exact 6.18.34-talos kernel-build tree.
  - image: "{{ .BUILD_ARG_PKGS_PREFIX }}/rocket-patched-pkg:{{ .BUILD_ARG_PKGS }}"
steps:
  - prepare:
      - |
        mkdir -p /rootfs
  - install:
      - |
        export KERNELRELEASE=$(find /usr/lib/modules -type d -name "*-talos" -exec basename {} \;)
        # Install to extra/, which depmod's default search order ranks ABOVE the
        # in-tree kernel/drivers/accel/rocket/rocket.ko — so `modprobe rocket`
        # resolves to this PATCHED module, not the stock one. This extension
        # therefore REPLACES rockchip-rknn in the schematic (do not run both).
        install -D /usr/lib/modules/${KERNELRELEASE}/extra/rocket/rocket.ko \
          /rootfs/usr/lib/modules/${KERNELRELEASE}/extra/rocket/rocket.ko
        # Durable 600 MHz: modprobe applies this options line at every load
        # (coldplug included), so the clock lever survives reboots.
        install -D /pkg/files/modprobe.d/rocket-patched.conf \
          /rootfs/usr/local/lib/modprobe.d/rocket-patched.conf
  - test:
      - |
        # unsigned + stripped (loads only with module.sig_enforce removed at install)
        find /rootfs/usr/lib/modules -name '*.ko' -exec grep -FL '~Module signature appended~' {} \+
      - |
        mkdir -p /extensions-validator-rootfs
        cp -r /rootfs/ /extensions-validator-rootfs/rootfs
        cp /pkg/manifest.yaml /extensions-validator-rootfs/manifest.yaml
        /extensions-validator validate --rootfs=/extensions-validator-rootfs --pkg-name="${PKG_NAME}"
finalize:
  - from: /rootfs
    to: /rootfs
  - from: /pkg/manifest.yaml
    to: /
# {{ else }}
dependencies:
  - stage: base
steps:
  - prepare:
      - |
        mkdir /rootfs
finalize:
  - from: /pkg/manifest.yaml
    to: /manifest.yaml
  - from: /rootfs
    to: /rootfs
# {{ end }}
