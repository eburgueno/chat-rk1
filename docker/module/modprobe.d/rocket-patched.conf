# Durable NPU compute-clock setting for the patched rocket module.
#
# modprobe applies this `options` line whenever the module is loaded — including
# the udev/modalias coldplug that loads rocket before Talos's machine.kernel.modules
# controller runs — so the 081 clock lever takes effect at boot, persistently,
# without depending on load order. (This is why machine.kernel.modules parameters
# alone did NOT stick: coldplug loaded the module param-less first.)
#
# 600000000 Hz = the validated 600 MHz operating point. The param is set from
# runtime_resume (domain powered) and parks back to 200 MHz on idle. Override live
# via `echo <hz> > /sys/module/rocket/parameters/rocket_npu_clk_hz`, or with a
# higher-priority /etc/modprobe.d drop-in (machineconfig machine.files).
options rocket rocket_npu_clk_hz=600000000
