name: CI

# Validates that the rocket-runtime image still builds whenever its inputs
# change — the base image (Dockerfile FROM), the four pinned upstream commits
# (scripts/config.env.example), or the vendored bench harness. This is what
# gives a Renovate pin-bump PR a real signal before merge.
on:
  pull_request:
    paths:
      - "docker/runtime/**"
      - "scripts/config.env.example"
      - "bench/bench.sh"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "docker/runtime/**"
      - "scripts/config.env.example"
      - "bench/bench.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-runtime:
    name: Build rocket-runtime (validate only, no push)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load pinned build args from scripts/config.env.example
        id: cfg
        run: |
          set -a
          source scripts/config.env.example
          set +a
          {
            echo "rocket_userspace_ref=$ROCKET_USERSPACE_REF"
            echo "ggml_rocket_ref=$GGML_ROCKET_REF"
            echo "patches_ref=$PATCHES_REF"
            echo "llamacpp_ref=$LLAMACPP_REF"
          } >> "$GITHUB_OUTPUT"

      # Same staging step as scripts/10-build-runtime.sh — the Dockerfile
      # COPYs bench.sh from its own build context.
      - name: Stage bench harness
        run: cp bench/bench.sh docker/runtime/bench.sh

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/runtime
          platforms: linux/arm64
          push: false
          build-args: |
            ROCKET_USERSPACE_REF=${{ steps.cfg.outputs.rocket_userspace_ref }}
            GGML_ROCKET_REF=${{ steps.cfg.outputs.ggml_rocket_ref }}
            PATCHES_REF=${{ steps.cfg.outputs.patches_ref }}
            LLAMACPP_REF=${{ steps.cfg.outputs.llamacpp_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
